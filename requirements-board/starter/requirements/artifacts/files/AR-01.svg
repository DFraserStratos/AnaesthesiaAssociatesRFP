<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 818" width="1060" height="818" font-family="'Schibsted Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>The requirements loop</title>
<rect x="0" y="0" width="1060" height="818" rx="0" fill="#F3F6FA"/>
<path d="M196.0 205.0 H864.0 Q890.0 205.0 890.0 231.0 V539.0 Q890.0 565.0 864.0 565.0 H196.0 Q170.0 565.0 170.0 539.0 V231.0 Q170.0 205.0 196.0 205.0" stroke="#3B8FD6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g id="side-tools">
<rect id="tool-transcript-reconciler" x="30" y="20" width="280" height="78" rx="9" fill="#FFFFFF" stroke="#9C9CA8" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="44" y="42" font-size="11.5" font-weight="700" fill="#8A8A96" text-anchor="start">Side input</text>
<text x="44" y="63" font-size="15" font-weight="700" fill="#1B1B1F" text-anchor="start">transcript-reconciler</text>
<text x="44" y="83" font-size="12.5" font-weight="400" fill="#55555E" text-anchor="start">merges duplicate transcripts of a meeting</text>
<path d="M170.0 100 V121" stroke="#55555E" stroke-width="1.8"/><path d="M164.0 120 L176.0 120 L170.0 128 z" fill="#55555E"/>
<rect id="tool-artifacts" x="750" y="20" width="280" height="78" rx="9" fill="#FFFFFF" stroke="#9C9CA8" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="764" y="42" font-size="11.5" font-weight="700" fill="#8A8A96" text-anchor="start">Side input</text>
<text x="764" y="63" font-size="15" font-weight="700" fill="#1B1B1F" text-anchor="start">add-artifact · svg-diagram</text>
<text x="764" y="83" font-size="12.5" font-weight="400" fill="#55555E" text-anchor="start">add diagrams and documents to link to</text>
<path d="M890.0 100 V121" stroke="#55555E" stroke-width="1.8"/><path d="M884.0 120 L896.0 120 L890.0 128 z" fill="#55555E"/>
</g>
<rect id="step-1" x="20" y="130" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#D3DCE6" stroke-width="1.2"/>
<circle cx="54" cy="166" r="16" fill="#3B8FD6"/>
<text x="54" y="172.72" font-size="17.6" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="80" y="174" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">Evidence</text>
<text x="38" y="206" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">A meeting, a transcript, an email or a</text>
<text x="38" y="224" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">decision someone has made: anything</text>
<text x="38" y="242" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">that changes what the system should do.</text>
<rect id="step-2" x="380" y="130" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#D3DCE6" stroke-width="1.2"/>
<circle cx="414" cy="166" r="16" fill="#3B8FD6"/>
<text x="414" y="172.72" font-size="17.6" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="440" y="174" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">/update-requirements</text>
<text x="398" y="206" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">Files the evidence as a note, answers the</text>
<text x="398" y="224" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">questions it settles, updates epics,</text>
<text x="398" y="242" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">features and stories, writes a change log.</text>
<rect id="step-3" x="740" y="130" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#D3DCE6" stroke-width="1.2"/>
<circle cx="774" cy="166" r="16" fill="#3B8FD6"/>
<text x="774" y="172.72" font-size="17.6" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="800" y="174" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">Review on the board</text>
<text x="758" y="206" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">Check statuses, answer outstanding</text>
<text x="758" y="224" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">questions and arrange the swimlanes.</text>
<text x="758" y="242" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">New answers go in the next update.</text>
<rect id="step-4" x="740" y="490" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#D3DCE6" stroke-width="1.2"/>
<circle cx="774" cy="526" r="16" fill="#3B8FD6"/>
<text x="774" y="532.72" font-size="17.6" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="800" y="534" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">Commit</text>
<text x="758" y="566" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">The team commits the catalogue to git.</text>
<text x="758" y="584" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">The commit is the baseline the build</text>
<text x="758" y="602" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">plan is updated from.</text>
<rect id="step-5" x="380" y="490" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#D3DCE6" stroke-width="1.2"/>
<circle cx="414" cy="526" r="16" fill="#3B8FD6"/>
<text x="414" y="532.72" font-size="17.6" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="440" y="534" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">/update-build-plan</text>
<text x="398" y="566" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">Pass it the commit. It re-grades the</text>
<text x="398" y="584" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">changed requirements against the app</text>
<text x="398" y="602" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">and updates the build plan.</text>
<rect id="step-6" x="20" y="490" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#D3DCE6" stroke-width="1.2"/>
<circle cx="54" cy="526" r="16" fill="#3B8FD6"/>
<text x="54" y="532.72" font-size="17.6" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="80" y="534" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">Build</text>
<text x="38" y="566" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">The team builds the next phases of the</text>
<text x="38" y="584" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">plan. What they learn comes to the</text>
<text x="38" y="602" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">next meeting as new evidence.</text>
<circle cx="350.0" cy="205.0" r="15" fill="#3B8FD6"/>
<path d="M346.0 198.0 L354.0 205.0 L346.0 212.0" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="710.0" cy="205.0" r="15" fill="#3B8FD6"/>
<path d="M706.0 198.0 L714.0 205.0 L706.0 212.0" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="890.0" cy="385.0" r="15" fill="#3B8FD6"/>
<path d="M883.0 381.0 L890.0 389.0 L897.0 381.0" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="710.0" cy="565.0" r="15" fill="#3B8FD6"/>
<path d="M714.0 558.0 L706.0 565.0 L714.0 572.0" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="350.0" cy="565.0" r="15" fill="#3B8FD6"/>
<path d="M354.0 558.0 L346.0 565.0 L354.0 572.0" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="170.0" cy="385.0" r="15" fill="#3B8FD6"/>
<path d="M163.0 389.0 L170.0 381.0 L177.0 389.0" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="144.0" y="381.0" font-size="13.5" font-weight="400" fill="#55555E" text-anchor="end" font-style="italic">Next meeting,</text>
<text x="144.0" y="399.0" font-size="13.5" font-weight="400" fill="#55555E" text-anchor="end" font-style="italic">round again</text>
<rect id="catalogue" x="204.0" y="310" width="652.0" height="150" rx="14" fill="#2E2E31" stroke="#55555C" stroke-width="1.2"/>
<text x="228.0" y="354" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="start">The catalogue</text>
<text x="228.0" y="380" font-size="14" font-weight="400" fill="#D7D7DE" text-anchor="start">Markdown files in git, one per epic, feature, story and question, plus notes,</text>
<text x="228.0" y="398" font-size="14" font-weight="400" fill="#D7D7DE" text-anchor="start">change logs and artifacts. The board and every skill read and edit the same files.</text>
<rect x="228.0" y="422" width="55.0" height="24" rx="12.0" fill="#3D3D42" stroke="#55555C" stroke-width="1.2"/>
<text x="255.5" y="438.32" font-size="12" font-weight="600" fill="#D7D7DE" text-anchor="middle">Epics</text>
<rect x="291.0" y="422" width="74.8" height="24" rx="12.0" fill="#3D3D42" stroke="#55555C" stroke-width="1.2"/>
<text x="328.4" y="438.32" font-size="12" font-weight="600" fill="#D7D7DE" text-anchor="middle">Features</text>
<rect x="373.79999999999995" y="422" width="68.19999999999999" height="24" rx="12.0" fill="#3D3D42" stroke="#55555C" stroke-width="1.2"/>
<text x="407.9" y="438.32" font-size="12" font-weight="600" fill="#D7D7DE" text-anchor="middle">Stories</text>
<rect x="450.0" y="422" width="81.4" height="24" rx="12.0" fill="#3D3D42" stroke="#55555C" stroke-width="1.2"/>
<text x="490.7" y="438.32" font-size="12" font-weight="600" fill="#D7D7DE" text-anchor="middle">Questions</text>
<rect x="539.4" y="422" width="55.0" height="24" rx="12.0" fill="#3D3D42" stroke="#55555C" stroke-width="1.2"/>
<text x="566.9" y="438.32" font-size="12" font-weight="600" fill="#D7D7DE" text-anchor="middle">Notes</text>
<rect x="602.4" y="422" width="94.6" height="24" rx="12.0" fill="#3D3D42" stroke="#55555C" stroke-width="1.2"/>
<text x="649.6999999999999" y="438.32" font-size="12" font-weight="600" fill="#D7D7DE" text-anchor="middle">Change logs</text>
<rect x="705.0" y="422" width="81.4" height="24" rx="12.0" fill="#3D3D42" stroke="#55555C" stroke-width="1.2"/>
<text x="745.7" y="438.32" font-size="12" font-weight="600" fill="#D7D7DE" text-anchor="middle">Artifacts</text>
<rect id="now-and-then" x="20" y="662" width="1020" height="76" rx="0" fill="none"/>
<path d="M30 662 H20 V738 H30" stroke="#55555E" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="684" font-size="13.5" font-weight="700" fill="#55555E" text-anchor="start" font-style="italic">Now and then</text>
<text x="36" y="702" font-size="13.5" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">link-requirements: links each item to the items its text names, after items are added or reworded.</text>
<text x="36" y="720" font-size="13.5" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">consistency-review: catches drift across the whole catalogue (stale wording, contradicted decisions).</text>
<rect x="20" y="758" width="1020" height="40" rx="10" fill="#FFF5C4" stroke="#EFD46A" stroke-width="1.2"/>
<text x="530.0" y="785" font-size="19" fill="#1B1B1F" text-anchor="middle"><tspan font-weight="800">Each round:</tspan> evidence → update requirements → review → commit → update the plan → build</text>
</svg>
