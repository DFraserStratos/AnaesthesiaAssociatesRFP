<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />

    <!--
      `viewport-fit=cover` is MANDATORY, not cosmetic: without it every
      `env(safe-area-inset-*)` resolves to 0 and the whole inset contract in
      `src/theme/global.css` silently collapses to its floors.

      `interactive-widget=resizes-content` is the zero-JS Android path for the
      software keyboard (Chrome 108+). Safari ignores it, which is why
      `MobileViewport` also watches `visualViewport`. Complementary, not
      redundant.

      No `maximum-scale` and no `user-scalable=no`: that is a WCAG 2.1 SC 1.4.4
      failure, iOS Safari has ignored it since iOS 10 anyway, and both real
      causes of accidental zoom (double-tap and sub-16px inputs) are fixed
      properly in the stylesheet.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <title>AA Booking &amp; Billing</title>

    <!-- The manifest's `theme_color` covers the INSTALLED app; this meta covers
         the browser tab before install, and iOS reads only the meta. The plugin
         injects the manifest link but not this, so it is written by hand. Keep
         the two in step: the value is measured, not chosen — see the comment on
         `theme_color` in `vite.pwa.config.ts`. -->
    <meta name="theme-color" content="#F3EAEC" />

    <!-- Standalone display. RESOLVED ON DEVICE (2026-08-03), and the two lines
         below are one decision, not two.

         `default` keeps the status bar OUTSIDE the web view: iOS starts the view
         below it and paints the reserved band with the document background, so
         the band came out a flat `#F6F8F7` while the atmosphere started beneath
         it — a hard horizontal seam across the top of every screen. Worse, a
         reserved band is not a safe area, so `env(safe-area-inset-top)` reported
         0 and `--aa-inset-top` sat on its 12px floor: the app also lost the full
         status-bar height off the bottom of the canvas.

         `black-translucent` starts the web view at y=0. The atmosphere then
         flows under the status bar exactly as it does under the frame's fake
         one, and `env(safe-area-inset-top)` reports the device's real reserve
         (59px on a 14 Pro, 47px on a 13), which the inset contract already
         consumes at every top call site. No seam, full-bleed canvas, headers
         still clear of the glyphs.

         Glyph colour was the one real risk, and it is now OBSERVED, not
         assumed: on the test handset iOS renders DARK glyphs over the wash,
         which is what this light canvas needs. They stay legible with a sheet
         open too — `scrim` is `rgba(23,35,32,0.32)`, which composites the wash
         to roughly `#ACABAA` and leaves dark glyphs around 9:1. If some future
         iOS forces white glyphs instead, they would land on the white card
         header: revert this line to `default` and change the inline
         `background` below to `#F3EAEC` (the measured top-of-atmosphere colour,
         the same value as `theme_color`) so the reserved band at least matches.

         DEPLOYING A CHANGE TO THIS LINE NEEDS AN APP RELAUNCH, NOT A RELOAD.
         iOS builds the standalone window — its geometry and its status-bar
         style — when the web view is created at launch, from the HTML it loads
         at that moment. A service-worker update swaps the CONTENT of a running
         app, so the More tab's Build card will report the new build while the
         window is still laid out to the old chrome, and the change looks like
         it silently failed. Force-quit from the app switcher and reopen; if
         that does not take, remove the home-screen icon and re-add it (which
         also clears the app's storage, so the demo world reseeds). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AA Booking" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- iOS composites alpha onto black and applies its own squircle, so this
         one is opaque and un-rounded. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />

    <!-- Self-hosted, so these are preloadable and precacheable. Only the latin
         subsets: latin-ext is real but rare, and waiting on it would delay
         first paint for a handful of macrons. `crossorigin` is required even
         same-origin, because fonts are always fetched in CORS mode. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/schibsted-grotesk-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/spline-sans-mono-latin.woff2" crossorigin />

    <!-- First paint is the canvas colour, not white. Android additionally gets
         a generated splash from the manifest's `background_color`; iOS ignores
         that, which is why this inline rule matters more than it looks.
         `overflow: hidden` makes "there is no document scroll" literally true,
         which is what lets `position: fixed` and `100dvh` behave under the iOS
         keyboard. -->
    <!-- `height: 100%` on all three is LOAD-BEARING, not tidiness. In standalone
         `.aa-mobile-viewport` sizes itself with `height: 100%` rather than
         `100dvh`, because iOS under-reports the viewport units by the status
         bar height once the status bar is translucent (the full account is on
         that rule in `src/theme/global.css`). A percentage height needs an
         unbroken chain to the initial containing block, so a missing height on
         any of html / body / #root collapses the host to zero. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f8f7;
        overflow: hidden;
      }

      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
