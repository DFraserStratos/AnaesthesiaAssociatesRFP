<!-- AA app icon, "any" purpose: the iOS home-screen artwork and the browser favicon.
     White serif AA monogram, full bleed on AA crimson, cap height 40% of the canvas
     (Georgia's cap A is wide, so two of them still span 84% of the width, leaving an 8%
     side margin that iOS's own squircle clears). Type is fontFamily.serif from
     src/theme/tokens.ts. The positive letter-spacing undoes Georgia's heavy AA kern pair,
     which otherwise fuses the two baseline serifs into one slab; the x offset compensates
     for the trailing letter-spacing that text-anchor="middle" would count as ink. The
     glyphs sit 8px above the geometric centre so they read as optically centred.
     Regenerate the PNGs with `npm run icons` after any change here. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Anaesthesia Associates">
  <title>Anaesthesia Associates</title>
  <rect width="512" height="512" fill="#A91E3E"/>
  <text x="268.5" y="350.4" fill="#FFFFFF" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="291" letter-spacing="26.2">AA</text>
</svg>
