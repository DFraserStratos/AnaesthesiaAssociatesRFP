<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Overlay Changes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Base: the switcher, views and page mocks from lists-ideas.html. Tokens are the app's own (aa-prototype/src/theme/tokens.ts). */
:root{
  --ink:#172320;--slate:#58635F;--mist:#8A9490;--lineStrong:#C9D1CE;--line:#E2E7E5;--sunken:#EDF1EF;--bg:#F6F8F7;--surface:#FFFFFF;--grid:#F1F4F2;
  --brand:#A91E3E;--brandMuted:#D89AA9;
  --teal:#0D6E63;--tealTint:#E1F0ED;
  --ok:#1E8E5A;--okTint:#E3F4EB;--okOn:#157A49;
  --warn:#A16207;--warnTint:#F9F0DC;--warnOn:#7C4D08;
  --err:#C2403C;--errTint:#FAE9E7;--errOn:#9C332F;
  --e1:0 1px 2px rgba(23,35,32,.05),0 2px 6px rgba(23,35,32,.05);
  --e2:0 2px 4px rgba(23,35,32,.06),0 8px 20px rgba(23,35,32,.09);
  --e3:0 8px 16px rgba(23,35,32,.10),0 24px 56px rgba(23,35,32,.18);
  --barH:64px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
a{color:var(--teal)}
button{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(13,110,99,.30);border-radius:8px}

/* ---------- the fixed switcher ---------- */
.bar{position:fixed;top:0;left:0;right:0;height:var(--barH);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 20px}
.bar .ttl{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.bar .ttl small{display:block;font-weight:500;font-size:12px;color:var(--slate);letter-spacing:0}
.opts{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;align-self:stretch;align-items:stretch}
.opts::-webkit-scrollbar{display:none}
.opt{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:2.5px solid transparent;color:var(--slate);white-space:nowrap;font-size:13.5px;font-weight:600}
.opt svg{flex:none;color:var(--mist)}
.opt b{color:inherit;font-weight:700}
.opt:hover{color:var(--ink)}
.opt[aria-selected="true"]{color:var(--ink);border-color:var(--teal)}
.opt[aria-selected="true"] svg{color:var(--teal)}
.opt:focus-visible{box-shadow:inset 0 0 0 2px rgba(13,110,99,.35);border-radius:6px}
.opt .rec{font-size:10.5px;font-weight:700;color:var(--okOn);background:var(--okTint);border-radius:999px;padding:0 7px;line-height:17px}
.keys{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mist);white-space:nowrap}
.kbd{font-family:"Spline Sans Mono",monospace;font-size:11px;border:1px solid var(--lineStrong);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--slate);background:#fff}
.step{all:unset;cursor:pointer;width:30px;height:30px;border:1px solid var(--lineStrong);border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.step:hover{border-color:var(--teal);color:var(--teal)}
@media (max-width:1640px){.keys .hint{display:none}}

/* ---------- one view at a time ---------- */
main{padding-top:var(--barH)}
.view{display:none;height:calc(100vh - var(--barH));min-height:560px}
.view.on{display:grid;grid-template-rows:auto minmax(0,1fr)}
.vhead{display:flex;align-items:flex-end;gap:24px;padding:18px 24px 14px}
.vhead h2{font-size:24px;line-height:30px;letter-spacing:-.015em}
.vhead h2 .l{color:var(--mist);font-weight:600;margin-right:10px}
.vhead p{color:var(--slate);font-size:14.5px;max-width:78ch;margin-top:3px}
.vhead .grow{flex:1;min-width:0}
.subs{display:flex;gap:4px;background:var(--sunken);border-radius:10px;padding:3px;flex:none}
.subs button{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--slate);padding:6px 12px;border-radius:8px;white-space:nowrap}
.subs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--e1)}
.subs button:focus-visible{box-shadow:0 0 0 2px rgba(13,110,99,.35)}
.vbody{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding:0 24px 20px;min-height:0}
.stage{min-width:0;min-height:0;position:relative}
.fwrap{position:relative;border-radius:12px;overflow:hidden;box-shadow:var(--e3);border:1px solid var(--line);background:var(--bg)}
.frame{position:absolute;top:0;left:0;width:1440px;height:860px;transform-origin:0 0;display:none;grid-template-columns:200px minmax(0,1fr);overflow:hidden;font-size:13px;line-height:1.4;background:var(--bg)}
.frame.on{display:grid}
.why{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:14px;padding-right:2px}
.why section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.why h3{font-size:14px;margin-bottom:6px}
.why ul{margin:0;padding-left:18px;font-size:13.5px}
.why li{margin-bottom:5px}
.why li::marker{color:var(--mist)}
.why p{font-size:13.5px;color:var(--slate)}
.why .for h3{color:var(--okOn)}
.why .against h3{color:var(--errOn)}
.why .size{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.why .size b{font-size:14px}
.meter{display:inline-flex;gap:3px}
.meter i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.meter i.f{background:var(--teal)}
@media (max-width:1000px){
  .view.on{height:auto;display:block}
  .vhead{flex-direction:column;align-items:flex-start}
  .vbody{grid-template-columns:1fr}
  .why{overflow:visible}
}
@media (max-width:640px){.vhead,.vbody{padding-left:16px;padding-right:16px}.bar{padding:0 12px;gap:12px}.bar .ttl small{display:none}}

/* ---------- text views (start, decide) ---------- */
.doc{overflow-y:auto;grid-row:1 / -1}
.doc .in{max-width:1180px;margin:0 auto;padding:36px 24px 64px}
.doc h1{font-size:40px;line-height:1.08;letter-spacing:-.025em;font-weight:800;max-width:20ch}
.doc .lede{font-size:17px;color:var(--slate);max-width:66ch;margin-top:14px}
.doc h2{font-size:22px;letter-spacing:-.01em;margin:40px 0 14px}
.find{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.find{grid-template-columns:1fr}}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.fc h3{font-size:15px;margin-bottom:6px}
.fc p{font-size:14px;color:var(--slate)}
.fc p+p{margin-top:8px}
.navcmp{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.navcmp{grid-template-columns:1fr}}
.mininav{background:var(--ink);color:#B9C4C0;border-radius:12px;padding:14px 10px;width:210px;font-size:13px}
.mininav h4{color:#fff;font-size:12.5px;font-weight:600;margin:0 8px 10px}
.mininav div{padding:6px 8px;border-radius:7px;display:flex;justify-content:space-between}
.mininav .gone{color:#6E7C77;text-decoration:line-through}
.mininav .new{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
.mininav .ct{background:var(--warn);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;padding:0 7px;line-height:18px}
.mininav .ct.r{background:var(--err)}
.jobs{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--e1);font-size:14px}
.jobs th,.jobs td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.jobs th{font-size:12.5px;color:var(--slate);font-weight:600;background:var(--bg)}
.jobs td:first-child{font-weight:600}
.jobs .tl{display:flex;gap:2px;width:220px}
.jobs .tl i{flex:1;height:8px;border-radius:3px;background:var(--line)}
.jobs .tl i.f{background:var(--teal)}
.jobs .tll{display:flex;justify-content:space-between;width:220px;font-size:11px;color:var(--mist)}
.opts-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.opts-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ol{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ol:hover{border-color:var(--teal)}
.ol svg{color:var(--teal)}
.ol b{font-size:14.5px}
.ol span{font-size:13px;color:var(--slate)}
.gate{margin-top:28px;background:var(--warnTint);color:var(--warnOn);border-radius:12px;padding:12px 16px;font-size:14px;max-width:80ch}
.gate b{color:var(--warnOn)}

/* decide */
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:14px}
.q h3{font-size:16px}
.q > p{font-size:14px;color:var(--slate);margin-top:4px;max-width:80ch}
.ch{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.ch label{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px}
.ch label:hover{border-color:var(--lineStrong)}
.ch input{accent-color:var(--teal);margin-top:4px}
.ch label:has(input:checked){border-color:var(--teal);background:var(--tealTint)}
.ch small{display:block;color:var(--slate);font-size:13px}
.ch .r{font-size:11px;font-weight:700;color:var(--okOn);background:var(--okTint);border-radius:999px;padding:0 7px;line-height:17px;margin-left:6px;vertical-align:1px}
.q textarea{width:100%;margin-top:10px;min-height:56px;border:1px solid var(--lineStrong);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;resize:vertical}
.q textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,110,99,.2)}
.copy{display:flex;align-items:center;gap:14px;margin-top:8px}
.cbtn{all:unset;cursor:pointer;background:var(--teal);color:#fff;font-weight:600;border-radius:10px;padding:10px 18px;font-size:14px}
.cbtn:focus-visible{box-shadow:0 0 0 3px rgba(13,110,99,.35)}
.copied{font-size:13.5px;color:var(--okOn)}
.reco{background:var(--surface);border-radius:16px;box-shadow:var(--e2);padding:22px 26px;border-left:4px solid var(--teal);margin-bottom:22px}
.reco h3{font-size:19px;margin-bottom:6px}
.reco p{max-width:84ch}
.reco p+p{margin-top:8px}

/* ---------- inside the mocks ---------- */
.side{background:var(--ink);color:#B9C4C0;padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.side .wm{font-family:Georgia,serif;color:#fff;font-size:14px;margin:0 10px 4px}
.side .ad{color:var(--brandMuted);font-size:10px;letter-spacing:.08em;margin:0 10px 22px;font-weight:600}
.side a{padding:8px 10px;border-radius:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:inherit}
.side a.on{background:rgba(255,255,255,.07);color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
.side .ct{background:var(--warn);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;padding:0 7px;line-height:18px}
.side .ct.r{background:var(--err)}
.mainc{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0;padding:22px 28px 22px}
.phd{display:flex;align-items:flex-end;gap:24px}
.phd .t{flex:1;min-width:0}
.phd h1{font-size:24px;letter-spacing:-.015em;line-height:30px}
.phd h1 .pl{margin-left:8px;vertical-align:4px}
.psub{color:var(--slate);font-size:13.5px;margin-top:2px}
.back{color:var(--teal);font-weight:600;font-size:13px;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.ltabs{display:flex;gap:24px;border-bottom:1px solid var(--line);flex:none}
.ltabs span{font-size:14px;font-weight:600;color:var(--slate);padding:0 0 10px;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.ltabs span.on{color:var(--ink);border-color:var(--teal)}
.ltabs .n{font-size:11px;font-weight:700;color:var(--warnOn);background:var(--warnTint);border-radius:999px;padding:0 7px;line-height:18px;font-variant-numeric:tabular-nums}
.ltabs .n.e{color:var(--errOn);background:var(--errTint)}
.tool{display:flex;gap:10px;align-items:center;flex:none}
.tool .end{margin-left:auto;font-size:12.5px;color:var(--slate);white-space:nowrap}
.srch{height:34px;border:1px solid var(--lineStrong);border-radius:999px;padding:0 14px;display:flex;align-items:center;gap:8px;color:var(--mist);background:#fff;font-size:13px;width:260px}
.sel{height:34px;border:1px solid var(--lineStrong);border-radius:10px;padding:0 30px 0 12px;display:flex;align-items:center;gap:6px;position:relative;background:#fff;font-weight:500;white-space:nowrap;font-size:13px;color:var(--ink)}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--slate);border-bottom:1.6px solid var(--slate);transform:translateY(-70%) rotate(45deg)}
.fpills{display:flex;gap:6px}
.fp{height:32px;border:1px solid var(--lineStrong);border-radius:999px;padding:0 13px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--slate);background:#fff;white-space:nowrap}
.fp.on{background:var(--tealTint);border-color:var(--teal);color:var(--teal)}
.fp .c{font-family:"Spline Sans Mono",monospace;font-size:11.5px;font-weight:500;color:var(--mist)}
.fp.on .c{color:var(--teal)}
.btn{background:var(--teal);color:#fff;font-weight:600;border-radius:10px;padding:9px 16px;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.btn2{background:#fff;color:var(--ink);border:1px solid var(--lineStrong);font-weight:600;border-radius:10px;padding:8px 14px;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.ta{color:var(--teal);font-weight:600;font-size:12.5px;white-space:nowrap}
.ta + .ta{margin-left:14px}
.tcard{flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--e1);display:flex;flex-direction:column;overflow:hidden}
.tcard .tb{flex:1;min-height:0;overflow:hidden}
.tfoot{border-top:1px solid var(--line);padding:10px 16px;font-size:12.5px;color:var(--slate);display:flex;align-items:center;gap:10px}
.tfoot .pg{margin-left:auto;display:flex;gap:4px}
.tfoot .pg span{min-width:28px;height:28px;border:1px solid var(--lineStrong);border-radius:8px;display:grid;place-items:center;color:var(--ink);font-size:12.5px;padding:0 6px}
.tfoot .pg span.on{background:var(--teal);border-color:var(--teal);color:#fff}
.it{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.it th{font-size:12px;color:var(--slate);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
.it th.so{color:var(--teal)}
.it td{padding:9px 12px;border-bottom:1px solid var(--grid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.it td.r,.it th.r{text-align:right}
.it .b{font-weight:600}
.it .s{color:var(--slate)}
.it .m{font-family:"Spline Sans Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;color:var(--slate)}
.it tr.g td{background:var(--bg);font-size:12.5px;font-weight:700;color:var(--ink);padding:7px 12px;border-bottom:1px solid var(--line)}
.it tr.g td span{color:var(--mist);font-weight:600;margin-left:8px}
.it tr.g td em{font-style:normal;color:var(--errOn);font-weight:600;margin-left:8px}
.it tr.hov td{background:#FAFCFB}
.it tr.dim td{color:var(--mist)}
.pl{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:0 8px;line-height:20px;white-space:nowrap;vertical-align:middle}
.pl + .pl{margin-left:4px}
.pl.w{background:var(--warnTint);color:var(--warnOn)}
.pl.e{background:var(--errTint);color:var(--errOn)}
.pl.o{background:var(--okTint);color:var(--okOn)}
.pl.t{background:var(--tealTint);color:var(--teal)}
.pl.n{background:var(--sunken);color:var(--slate)}
.pl.d{background:#fff;color:var(--slate);box-shadow:inset 0 0 0 1px var(--lineStrong);border:0}
.prog{display:inline-flex;align-items:center;gap:8px}
.prog i{display:inline-block;width:54px;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.prog i b{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:3px}
.body2{flex:1;min-height:0;display:grid;gap:16px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--e1);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.rcard h4{font-size:13.5px}
.rcard .dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:12.5px}
.rcard .dl span{color:var(--slate)}
.rcard .hi{font-size:12.5px;display:flex;gap:8px}
.rcard .hi span{color:var(--mist);font-family:"Spline Sans Mono",monospace;font-size:11.5px;width:74px;flex:none}
.note{background:var(--warnTint);color:var(--warnOn);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.45}
.daylist{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--e1);overflow:hidden;display:flex;flex-direction:column}
.daylist .dh{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--slate);display:flex;justify-content:space-between}
.dayrow{padding:10px 14px;border-bottom:1px solid var(--grid);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center}
.dayrow .d{font-weight:600;font-size:13.5px}
.dayrow .d small{color:var(--mist);font-weight:500;margin-left:6px;font-size:12px}
.dayrow .c{font-family:"Spline Sans Mono",monospace;font-size:12px;color:var(--slate)}
.dayrow .dots{grid-column:1 / -1;display:flex;gap:6px;font-size:11.5px;color:var(--slate)}
.dayrow .dots i{display:inline-flex;align-items:center;gap:4px;font-style:normal}
.dayrow .dots i::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--x)}
.dayrow.on{background:var(--tealTint);box-shadow:inset 3px 0 0 var(--teal)}
.dayrow.sp{background:var(--bg)}
.dsec{font-size:12px;font-weight:700;color:var(--slate);padding:12px 16px 6px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dsec span{color:var(--mist);font-weight:600}
.ready{padding:12px 16px;font-size:12.5px;color:var(--slate);display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.ready::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}

/* ---------- this page: overlays drawn at their real widths ---------- */
:root{--scrim:rgba(23,35,32,.32)}
.vbody{grid-template-columns:minmax(0,1fr) 340px}
.ov{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
.ov.r{justify-content:flex-end;align-items:stretch;padding:0}
.dwrap{position:relative;display:flex;flex-direction:column;max-height:100%}
.dim{position:absolute;left:0;right:0;top:-30px;height:20px;display:flex;align-items:center;justify-content:center;border-left:1.5px solid #fff;border-right:1.5px solid #fff}
.dim::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px dashed rgba(255,255,255,.85)}
.dim span{position:relative;background:var(--ink);color:#fff;font:600 12px/20px "Spline Sans Mono",monospace;padding:0 9px;border-radius:999px}
.dim.aft span{background:var(--teal)}
.dlg{position:relative;width:520px;max-height:740px;background:var(--surface);border-radius:20px;box-shadow:var(--e3);display:flex;flex-direction:column;overflow:hidden;font-size:14px;line-height:1.45}
.dhd{flex:none;padding:24px 24px 14px;position:relative}
.dhd h2{font-size:18px;line-height:24px;font-weight:700;padding-right:36px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.dtab{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.srchw{min-height:48px;background:var(--sunken);border-radius:10px;padding:0 14px;display:flex;align-items:center;gap:8px;color:var(--mist);font-size:15px}

.ptag{position:absolute;top:18px;right:calc(100% + 14px);background:var(--ink);color:#fff;font:600 12px/22px "Spline Sans Mono",monospace;padding:0 10px;border-radius:999px;white-space:nowrap}

.pbd{flex:1;min-height:0;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.pft{border-top:1px solid var(--line);padding:14px 24px;display:flex;justify-content:flex-end;gap:10px}

.stp{width:24px;height:24px;border-radius:50%;background:var(--tealTint);color:var(--teal);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}

.disc{color:var(--teal);font-weight:600;font-size:13px}
/* page mocks used behind the overlays */
.cols{flex:1;min-height:0;display:grid;gap:18px}
.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile span{font-size:12px;color:var(--slate)}
.tile b{display:block;font-size:20px;margin:2px 0}
.tile small{font-size:12px;color:var(--slate)}
.subnav{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;gap:1px;font-size:13px;align-self:start}

.vh{display:flex;align-items:flex-end;gap:16px}
.vh .t{flex:1}

.desk{background:#E6EBE9;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.dcol{background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.dcol .in{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.dcol .ft{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;align-items:center}
.dcol .ft .nt{flex:1;font-size:12px;color:var(--slate)}
.dgrid{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.dgrid .ruler{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid var(--line);font:11px "Spline Sans Mono",monospace;color:var(--mist)}
.dgrid .ruler div:last-child{display:flex;justify-content:space-between;padding:6px 10px}
.drow{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid var(--grid);height:38px;align-items:center}

.pdfp{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);font-family:Arial,Helvetica,sans-serif;color:#222;flex:none;position:relative}
.pdfp .ph{display:flex;justify-content:space-between;font-size:11px}
.pdfp h6{text-align:center;font-size:15px;margin:2px 0 0}
.pdfp .hr{text-align:center;font-size:11px;margin-bottom:10px}
.pdfp table{width:100%;border-collapse:collapse;font-size:10.5px}
.pdfp th{text-align:left;border-bottom:1.5px solid #222;padding:4px 6px}
.pdfp td{border-bottom:1px solid #bbb;padding:6px;vertical-align:top}
.pdfp .bx{outline:2px solid #E0A84A;background:rgba(249,240,220,.7)}
.pdfp .ff{position:absolute;bottom:10px;left:28px;right:28px;font-size:9.5px;color:#666;display:flex;justify-content:space-between}
.pdfscroll{background:var(--sunken);border-radius:14px;padding:16px;overflow-x:auto;overflow-y:hidden;margin-top:4px;scrollbar-width:auto}
.pdfscroll.cut{position:relative}
/* start page */
.ruler2{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.rl{display:grid;grid-template-columns:180px minmax(0,1fr) 150px;gap:14px;align-items:center;font-size:13.5px}

.rl .bar i{position:absolute;top:3px;bottom:3px;border-radius:5px;background:var(--tealTint);border:1.5px solid var(--teal);display:flex;align-items:center;padding:0 8px;font:600 11.5px "Spline Sans Mono",monospace;color:var(--teal);font-style:normal}
.rl .bar i.p{right:3px}

.rl .bar i.new{background:#fff;border-style:dashed}

.rl b{font-weight:600}
.rules{counter-reset:r;display:flex;flex-direction:column;gap:10px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px 14px 56px;position:relative;font-size:14.5px}
.rule::before{counter-increment:r;content:counter(r);position:absolute;left:18px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--tealTint);color:var(--teal);font-weight:700;font-size:13px;display:grid;place-items:center}
.rule b{display:block;font-size:15px;margin-bottom:2px}
.rule span{color:var(--slate);font-size:14px}
.kept{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kept{grid-template-columns:1fr}.rl{grid-template-columns:1fr}}
.chg{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--e1);font-size:14px}
.chg th,.chg td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}

.chg button{all:unset;cursor:pointer;color:var(--teal);font-weight:600}

.conf{font-size:11.5px;font-weight:700;border-radius:999px;padding:0 8px;line-height:20px;white-space:nowrap}
.conf.h{background:var(--okTint);color:var(--okOn)}
.conf.m{background:var(--warnTint);color:var(--warnOn)}
.conf.l{background:var(--sunken);color:var(--slate)}
.why .chgbox{display:flex;align-items:center;gap:8px;font-family:"Spline Sans Mono",monospace;font-size:12.5px;flex-wrap:wrap}
.why .chgbox span{background:var(--sunken);border-radius:999px;padding:0 9px;line-height:22px}
.why .chgbox span.to{background:var(--tealTint);color:var(--teal);font-weight:600}
.why .file{font-family:"Spline Sans Mono",monospace;font-size:12px;color:var(--slate);word-break:break-all}
.why .mine{border-left:3px solid var(--teal)}
</style>

<body>

<header class="bar">
  <div class="ttl">Admin dialogs and side panels<small>Before and after, 27 November 2026</small></div>
  <nav class="opts" role="tablist" aria-label="Changes" id="opts"></nav>
  <div class="keys"><span class="hint"><span class="kbd">←</span> <span class="kbd">→</span> change · <span class="kbd">B</span> before / after</span>
    <button class="step" id="prev" aria-label="Previous">‹</button><button class="step" id="next" aria-label="Next">›</button></div>
</header>

<main id="views"></main>

<script>
(() => {
  /* ===================== page mock helpers (as lists-ideas.html) ===================== */
  const S = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  const X = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  const NAV = [['Day view'], ['Intake', 18], ['Lists', 50], ['Notifications'], ['Finances', 3], ['People'], ['Contracts'], ['Master data'], ['Audit']];
  const side = (on) => `<nav class="side"><div class="wm">Anaesthesia | Associates</div><div class="ad">ADMIN</div>${
    NAV.map(([n, c]) => `<a class="${n === on ? 'on' : ''}">${n}${c ? ` <span class="ct">${c}</span>` : ''}</a>`).join('')}</nav>`;
  const hdr = (title, sub, actions = '', back = '') => `<div class="phd"><div class="t">${back ? `<div class="back">‹ ${back}</div>` : ''}<h1>${title}</h1>${sub ? `<p class="psub">${sub}</p>` : ''}</div>${actions}</div>`;
  const tabs = (list, on) => `<div class="ltabs">${list.map(([l, n]) => `<span class="${l === on ? 'on' : ''}">${l}${n ? ` <i class="n" style="font-style:normal">${n}</i>` : ''}</span>`).join('')}</div>`;
  const srch = (p, w = 260) => `<div class="srch" style="width:${w}px">${S}<span>${p}</span></div>`;
  const sel = (v) => `<div class="sel">${v}</div>`;
  const fps = (list) => `<div class="fpills">${list.map(([l, c, on]) => `<span class="fp${on ? ' on' : ''}">${l}${c !== undefined ? ` <span class="c">${c}</span>` : ''}</span>`).join('')}</div>`;
  const tool = (left, end = '') => `<div class="tool">${left}${end ? `<span class="end">${end}</span>` : ''}</div>`;
  const table = (cols, rows) => `<div class="tcard"><div class="tb"><table class="it"><colgroup>${cols.map((c) => `<col style="width:${c[1]}">`).join('')}</colgroup><thead><tr>${cols.map((c) => `<th class="${c[2] ?? ''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  const g = (label, count = '', span = 9) => `<tr class="g"><td colspan="${span}">${label}${count !== '' ? `<span>${count}</span>` : ''}</td></tr>`;
  const card = (h, inner, extra = '') => `<div class="rcard" ${extra}><h4>${h}</h4>${inner}</div>`;
  const dl = (rows, w = 110) => `<div class="dl" style="grid-template-columns:${w}px 1fr">${rows.map(([k, v]) => `<span>${k}</span><div>${v}</div>`).join('')}</div>`;
  const cols = (main, rail, w = 412) => `<div class="cols" style="grid-template-columns:minmax(0,1fr) ${w}px">${main}<div class="rail">${rail}</div></div>`;
  const stack = (...xs) => `<div style="display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0">${xs.join('')}</div>`;

  /* ===================== overlay helpers ===================== */
  const fld = (label, value, o = {}) => `<div class="f">${label ? `<label>${label}</label>` : ''}<div class="well${o.ph ? ' ph' : ''}${o.mono ? ' mono' : ''}${o.sel ? ' sel' : ''}${o.ta ? ' ta' : ''}${o.dis ? ' dis' : ''}" ${o.rows ? `style="min-height:${o.rows * 21 + 24}px"` : ''}><span>${value}</span></div>${o.hint ? `<div class="hint ${o.hc ?? ''}">${o.hint}</div>` : ''}</div>`;
  const seg = (label, opts, on, wrap = false) => `<div class="f">${label ? `<label>${label}</label>` : ''}<div class="seg${wrap ? ' wrap' : ''}">${opts.map((o) => `<span class="${o === on ? 'on' : ''}">${o}</span>`).join('')}</div></div>`;
  const pair = (a, b, style = '') => `<div class="pair" style="${style}">${a}${b}</div>`;
  const foot = (sec, pri, note = '', full = false) => `<div class="dft">${note ? `<div class="nt">${note}</div>` : ''}<div class="row">${sec ? `<span class="fb s${full || !pri ? ' full' : ''}">${sec}</span>` : ''}${pri ? `<span class="fb p">${pri}</span>` : ''}</div></div>`;
  const dlg = ({ w = 520, title, pill = '', desc = '', body, ft = '', changed = false, h = '' }) =>
    `<div class="ov"><div class="dwrap"><div class="dim${changed ? ' aft' : ''}"><span>${w}px${changed ? ' after' : ''}</span></div><div class="dlg" style="width:${w}px;${h}"><div class="dhd"><h2>${title}${pill}</h2>${desc ? `<p>${desc}</p>` : ''}<span class="dx">${X}</span></div><div class="dbd">${body}</div>${ft}</div></div></div>`;
  const panel = ({ w = 600, title, meta = '', body, ft = '' }) =>
    `<div class="ov r"><div class="pwrap" style="width:${w}px"><span class="ptag">${w}px side panel</span><div class="phd2"><h2>${title}</h2>${meta ? `<div class="mt">${meta}</div>` : ''}<span class="dx">${X}</span></div><div class="pbd">${body}</div>${ft ? `<div class="pft">${ft}</div>` : ''}</div></div>`;
  const frames = {};
  const frame = (id, nav, page, overlay = '') => { frames[id] = side(nav) + `<div class="mainc">${page}</div>` + overlay; };

  /* ===================== 1 · Register refresh ===================== */

    { k: 'large', n: 'New large size', conf: 'm', title: 'A large dialog for documents and editors', where: 'Master data › Email templates › Edit (and Prepayment letters, the update email composer), Intake › an arrival › Open full size', file: 'shared/surface/Dialog.tsx (new size) · EmailTemplatesView.tsx · LetterTemplateSheet · UpdateEmailComposer.tsx · PdfPage.tsx',
      change: ['Dialog 760', 'Dialog 1040 (new)'], subs: [['l1', 'Template · 760'], ['l2', 'Template · 1040'], ['l3', 'PDF · 760'], ['l4', 'PDF · 1040']],
      pitch: 'Editors with a live preview split 760 into two columns of about 346px. A landscape PDF page is 842px wide, so "Open full size" scrolls sideways (already in the backlog). One larger size serves all four.',
      forL: ['The full-size PDF shows the whole page.', 'The template body and the preview stop wrapping every line.'],
      against: ['It is a new size, so it needs a design source in docs/design first.', 'An email preview at 346px is close to what a phone shows, so the email editor gains least.'] },
    { k: 'replace', n: 'Replace contract', conf: 'l', title: 'Replace a Contract from a date', where: 'Contracts › a Contract › Replace from a date', file: 'apps/admin/flows/ReplaceContractSheet.tsx',
      change: ['Side panel 600', 'A page'], subs: [['c1', 'Before · panel'], ['c2', 'After · page']],
      pitch: 'Four numbered steps, the New contract field sets, a Procedures table and radio cards in one 600 column. New contract is a page; this reuses its sections, so it could be a page too.',
      forL: ['Room for the table and the radio cards side by side.', 'A rail can say what happens on save.', 'Matches New contract.'],
      against: ['It was designed as a panel (docs/explorations/contracts-section.html), so this reverses a design choice.', 'A page loses the Contract behind it, though the panel already covers most of it.'] },
  ];
  const CONF = { h: ['High', 'h'], m: ['Medium', 'm'], l: ['Low', 'l'] };
  const views = document.getElementById('views');
  views.innerHTML = `<section class="view" id="v-start" role="tabpanel"><div class="doc"><div class="in" id="startIn"></div></div></section>` +
    V.map((v, i) => `<section class="view" id="v-${v.k}" role="tabpanel"><div class="vhead"><div class="grow"><h2><span class="l">${i + 1}</span>${v.title}</h2><p>${v.pitch}</p></div>
      <div class="subs">${v.subs.map(([id, l], j) => `<button aria-pressed="${j === 0}" data-f="${id}">${l}</button>`).join('')}</div></div>
      <div class="vbody"><div class="stage"><div class="fwrap">${v.subs.map(([id], j) => `<div class="frame${j === 0 ? ' on' : ''}" id="${id}"></div>`).join('')}</div></div>
      <aside class="why"><section class="mine"><h3>The change</h3><div class="chgbox"><span>${v.change[0]}</span>→<span class="to">${v.change[1]}</span></div><p style="margin-top:8px">${v.where}</p><p class="file" style="margin-top:6px">${v.file}</p><p style="margin-top:8px"><span class="conf ${CONF[v.conf][1]}">${CONF[v.conf][0]} confidence</span></p></section>
      <section class="for"><h3>For</h3><ul>${v.forL.map((x) => `<li>${x}</li>`).join('')}</ul></section>
      <section class="against"><h3>Against</h3><ul>${v.against.map((x) => `<li>${x}</li>`).join('')}</ul></section>
      ${v.note ? `<section><h3>About this mock</h3><p>${v.note}</p></section>` : ''}</aside></div></section>`).join('') +
    `<section class="view" id="v-decide" role="tabpanel"><div class="doc"><div class="in" style="max-width:920px"><h1 style="margin-bottom:22px">Decide</h1>
      <div class="reco"><h3>My pick: 1 to 3 now, 4, 6 and 7 together, the rest later</h3><p>Register refresh, Add anaesthetist and the Xero resolve are clear wins and small. The pickers, Recurring booking and New Draft List are one consistent widening, best done in one go. Add NHI is marginal. The large size needs a design source first, and Replace contract reverses a design you chose, so both are yours to call.</p></div>
      <div id="qs"></div><div class="copy"><button class="cbtn" id="copy">Copy my answers</button><span class="copied" id="copied" aria-live="polite"></span></div></div></div></section>`;
  Object.entries(frames).forEach(([id, html]) => { const el = document.getElementById(id); if (el) el.innerHTML = html; });

  /* ===================== start page ===================== */
  const SIZES = [['Side panel · list', 440, 'p', 'about 3', 'about 3', 'Day and Lists drawers only'], ['Dialog · default', 520, 'd', 'about 65', 'about 58', 'One task, one column'], ['Side panel · record', 600, 'p', '7', '5', 'A record with several actions'], ['Dialog · wide', 760, 'd', '6, plus 2 that widen', '10, plus 3 that widen', 'Tables, pairs, two columns'], ['Dialog · large (new)', 1040, 'd new', '0', '4', 'Documents, editors with a preview']];
  document.getElementById('startIn').innerHTML = `<h1>Every admin dialog and side panel, and what should change</h1>
    <p class="lede">Twelve agents read the admin app's code and found about 85 overlays: 75 dialogs (confirms included) and 10 side panels. This page shows the nine changes the review recommends, each over the screen it opens from, drawn at its real width on a 1440 by 860 screen. Flip Before and After with the buttons, or press <span class="kbd">B</span>.</p>
    <h2>The sizes, to scale on a 1440 screen</h2>
    <div class="ruler2">${SIZES.map(([l, w, k, now, after, use]) => `<div class="rl"><div><b>${l}</b><br><span class="n">${use}</span></div><div class="bar"><i class="${k.includes('p') ? 'p' : 'd'}${k.includes('new') ? ' new' : ''}" style="width:${(w / 1440) * 100}%">${w}</i></div><div class="n">Today ${now}<br>After ${after}</div></div>`).join('')}</div>
    <h2>The rule we already follow, written down</h2>
    <div class="rules">
      <div class="rule"><b>One task, one commit: a dialog.</b><span>Confirm, create, a short edit, pick, send, a history to read. Even when the form is long.</span></div>
      <div class="rule"><b>A record with several actions, opened from a row, a cell or a document: a side panel.</b><span>440 only from the Day grid, where it sits exactly over the right rail and never covers the grid; 600 everywhere else. A short form never gets a panel.</span></div>
      <div class="rule"><b>Numbered steps, or a form that reuses a page's sections: a page.</b><span>Like New contract.</span></div>
      <div class="rule"><b>A value the page already shows: edit it in place.</b><span>The record pages' cards. Existing dialogs stay unless they hurt.</span></div>
      <div class="rule"><b>Width follows content.</b><span>520 for one column. 760 for a table of three or more columns, fields that pair, two columns, or dense picker rows; widen only when the table appears if it only sometimes does. 1040 for documents and editors with a live preview.</span></div>
    </div>
    <p class="gate" style="background:var(--tealTint);color:var(--teal)"><b style="color:var(--teal)">Worth knowing:</b> both containers are modal. A side panel has a scrim and makes the page behind inert, so it lets you <i>see</i> the list, not work it row by row. That is why several "make it a panel" ideas were dropped.</p>
    <h2>The nine changes</h2>
    <table class="chg"><thead><tr><th>#</th><th>Overlay</th><th>Today → after</th><th>Confidence</th></tr></thead><tbody>${V.map((v, i) => `<tr><td>${i + 1}</td><td><button data-go="${v.k}">${v.title}</button></td><td class="m">${v.change[0]} → ${v.change[1]}</td><td><span class="conf ${CONF[v.conf][1]}">${CONF[v.conf][0]}</span></td></tr>`).join('')}</tbody></table>
    <h2>Looked at and kept as they are</h2>
    <div class="kept">
      <div class="fc"><h3>The List and Draft List drawers stay 440</h3><p>Their width is the Day view's right rail, so the drawer covers the rail and never the grid. If the List drawer feels tight, trim its five or six footer buttons instead.</p></div>
      <div class="fc"><h3>History stays a dialog</h3><p>Three of its callers open it from inside a 440 drawer; as a panel it would be a panel on a panel. The timeline already adapts to width.</p></div>
      <div class="fc"><h3>Code, modifier and payer pickers stay 520</h3><p>Their rows fit, and they are shared with the phone, where a panel would need a new surface slot.</p></div>
      <div class="fc"><h3>Additional invoice and the letter dialogs stay 520</h3><p>The invoice lines are cards made for narrow widths; the letter preview at about 470px is a comfortable reading width.</p></div>
    </div>
    <h2>Also found: tidy-ups with no visible change</h2>
    <ul style="font-size:14.5px;color:var(--slate);max-width:84ch">
      <li>Three confirms are built by hand (Retire an availability status, Retire an RVG group, End a pairing) instead of through ConfirmSheet.</li>
      <li>Session status and Funder sheets set a private width of 480 that would cap the body once the dialog widens; Funder's also branches on platform.</li>
      <li>The letter template editor calls Dialog directly while its email sibling goes through the surface.</li>
      <li>The surgeon page's retire dialog repeats its own title.</li>
    </ul>
    <p class="gate">Mocks are drawn from the code (labels, fields, columns and seed data), not screenshots. Heights and wrapping are close to the app, not exact.</p>`;

  /* ===================== the switcher ===================== */
  const opts = document.getElementById('opts');
  const TABS = [['start', 'Start', '']].concat(V.map((v, i) => [v.k, v.n, String(i + 1), v.conf])).concat([['decide', 'Decide', '']]);
  opts.innerHTML = TABS.map(([k, n, l]) => `<button class="opt" role="tab" aria-controls="v-${k}" data-k="${k}">${l ? `<b style="color:var(--mist)">${l}</b>` : ''}${n}</button>`).join('');
  const keys = TABS.map(([k]) => k);
  let cur = 'start';
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* storage off */ } } };
  const fit = () => {
    const v = document.getElementById(`v-${cur}`); if (!v) return;
    v.querySelectorAll('.stage').forEach((st) => {
      const w = st.querySelector('.fwrap'); if (!w) return;
      const narrow = window.innerWidth <= 1000;
      const s = narrow ? st.clientWidth / 1440 : Math.min(st.clientWidth / 1440, st.clientHeight / 860);
      w.style.width = `${1440 * s}px`; w.style.height = `${860 * s}px`;
      w.querySelectorAll('.frame').forEach((f) => { f.style.transform = `scale(${s})`; });
    });
  };
  const show = (k, push = true) => {
    if (!keys.includes(k)) k = 'start';
    cur = k;
    document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === `v-${k}`));
    document.querySelectorAll('.opt').forEach((b) => { const on = b.dataset.k === k; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; if (on) b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
    if (push) history.replaceState(null, '', `#${k}`);
    const doc = document.querySelector(`#v-${k} .doc`); if (doc) doc.scrollTop = 0;
    requestAnimationFrame(fit);
  };
  opts.addEventListener('click', (e) => { const b = e.target.closest('.opt'); if (b) show(b.dataset.k); });
  document.getElementById('startIn').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) show(b.dataset.go); });
  const step = (d) => show(keys[(keys.indexOf(cur) + d + keys.length) % keys.length]);
  document.getElementById('prev').addEventListener('click', () => step(-1));
  document.getElementById('next').addEventListener('click', () => step(1));
  document.querySelectorAll('.subs').forEach((sw) => sw.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    sw.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    sw.closest('.view').querySelectorAll('.frame').forEach((f) => f.classList.toggle('on', f.id === b.dataset.f));
  }));
  const flip = (d = 1) => {
    const sw = document.querySelector(`#v-${cur} .subs`); if (!sw) return;
    const bs = [...sw.querySelectorAll('button')]; const i = bs.findIndex((b) => b.getAttribute('aria-pressed') === 'true');
    bs[(i + d + bs.length) % bs.length].click();
  };
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
    else if (/^[1-9]$/.test(e.key)) show(keys[Number(e.key)]);
    else if (e.key === 'b' || e.key === 'B' || e.key === ']') flip(1);
    else if (e.key === '[') flip(-1);
  });
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => show(location.hash.slice(1), false));

  /* ===================== decide ===================== */
  const PICK = { refresh: 'do', anaesthetist: 'do', xero: 'do', pickers: 'do', nhi: 'skip', recurring: 'do', draft: 'do', large: 'later', replace: 'later' };
  const QS = V.map((v, i) => [v.k, `${i + 1}. ${v.title}`, `${v.change[0]} → ${v.change[1]}`, [['do', 'Make this change'], ['later', 'Later, or needs more design first'], ['skip', 'Leave it as it is']]])
    .concat([['rule', 'The rule', 'Adopt the five-line rule on the Start page as a settled ruling in docs/DECISIONS.md?', [['do', 'Yes, as written'], ['later', 'Yes, with changes (say which in the note)'], ['skip', 'No']]],
      ['tidy', 'The tidy-ups', 'Hand-built confirms to ConfirmSheet, drop the private 480 widths, the letter editor through the surface, the repeated retire title.', [['do', 'Do them with the changes'], ['skip', 'Leave them']]]]);
  const pickOf = (id) => PICK[id] ?? 'do';
  const saved = (() => { try { return JSON.parse(store.get('overlay-changes-answers') ?? '{}'); } catch { return {}; } })();
  const qs = document.getElementById('qs');
  qs.innerHTML = QS.map(([id, h, p, choices]) => `<div class="q"><h3>${h}</h3><p>${p}</p><div class="ch">${
    choices.map(([v, l]) => `<label><input type="radio" name="${id}" value="${v}" ${saved[id] === v ? 'checked' : ''}><span>${l}${pickOf(id) === v ? '<span class="r">My pick</span>' : ''}</span></label>`).join('')
  }</div><textarea name="${id}-note" placeholder="Anything to add">${saved[`${id}-note`] ?? ''}</textarea></div>`).join('');
  const save = () => {
    const out = {};
    qs.querySelectorAll('input:checked').forEach((i) => { out[i.name] = i.value; });
    qs.querySelectorAll('textarea').forEach((t) => { if (t.value.trim()) out[t.name] = t.value; });
    store.set('overlay-changes-answers', JSON.stringify(out));
  };
  qs.addEventListener('change', save); qs.addEventListener('input', save);
  document.getElementById('copy').addEventListener('click', async () => {
    const lines = ['# Admin dialogs and side panels: my answers', ''];
    QS.forEach(([id, h, , choices]) => {
      const v = qs.querySelector(`input[name="${id}"]:checked`)?.value;
      const c = choices.find(([x]) => x === v);
      const note = qs.querySelector(`textarea[name="${id}-note"]`).value.trim();
      lines.push(`- **${h}** ${c ? c[1] : '(not answered)'}`);
      if (note) lines.push(`  Note: ${note}`);
    });
    const msg = document.getElementById('copied');
    try { await navigator.clipboard.writeText(lines.join('\n')); msg.textContent = 'Copied. Paste it into the chat.'; }
    catch { msg.textContent = 'Copy is blocked here; select the answers and copy by hand.'; }
  });

  show(location.hash.slice(1) || 'start', false);
  document.fonts?.ready.then(fit);
})();
</script>
</body>
</html>
