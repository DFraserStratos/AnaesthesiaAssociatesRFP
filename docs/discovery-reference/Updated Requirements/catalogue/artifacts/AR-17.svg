<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1558 1162" width="1558" height="1162" font-family="'Schibsted Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Day, Slot, List, Booking, Procedure, Contract</title>
<rect x="0" y="0" width="1558" height="1162" rx="0" fill="#F3F6FA"/>
<rect id="day" x="490" y="20" width="1048" height="1062" rx="14" fill="#2E2E31" stroke="#55555C" stroke-width="1.2"/>
<text x="520" y="78" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="start">Day</text>
<text x="620" y="78" font-size="16" font-weight="400" fill="#D7D7DE" text-anchor="start">Two Slots per active anaesthetist: AM and PM</text>
<rect id="slot-am" x="520" y="106" width="988" height="204" rx="12" fill="#45454B" stroke="#6A6A72" stroke-width="1.2"/>
<text x="544" y="156" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">Slot</text>
<text x="628" y="156" font-size="20" font-weight="800" fill="#9CC9F0" text-anchor="start">(AM)</text>
<rect id="slot-status" x="544" y="182" width="940" height="104" rx="10" fill="#FCEAF2" stroke="#E2A3C4" stroke-width="1.4"/>
<text x="564" y="218" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">Status</text>
<text x="564" y="246" font-size="15" font-weight="400" fill="#55555E" text-anchor="start">A Slot has a status while no List is in it</text>
<text x="564" y="268" font-size="13" font-weight="400" fill="#55555E" text-anchor="start">Statuses are a user-maintained list</text>
<text x="1464" y="240" font-size="16" font-weight="700" fill="#55555E" text-anchor="end">etc.</text>
<rect x="1292.0" y="222" width="120" height="28" rx="14.0" fill="#FFE1C4" stroke="#F0A868" stroke-width="1.2"/>
<text x="1352" y="241.04" font-size="14" font-weight="600" fill="#9A4A0B" text-anchor="middle">On holiday</text>
<rect x="1154.0" y="222" width="128" height="28" rx="14.0" fill="#D9D9E0"/>
<text x="1218" y="241.04" font-size="14" font-weight="600" fill="#3C3C46" text-anchor="middle">Unavailable</text>
<rect x="1064.0" y="222" width="80" height="28" rx="14.0" fill="#C4EDD2" stroke="#8FCBA2" stroke-width="1.2"/>
<text x="1104" y="241.04" font-size="14" font-weight="600" fill="#1D6B3B" text-anchor="middle">Free</text>
<rect id="slot-pm" x="520" y="330" width="988" height="728" rx="12" fill="#45454B" stroke="#6A6A72" stroke-width="1.2"/>
<text x="544" y="380" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">Slot</text>
<text x="628" y="380" font-size="20" font-weight="800" fill="#9CC9F0" text-anchor="start">(PM)</text>
<rect id="list" x="544" y="410" width="940" height="624" rx="12" fill="#E1F0FB" stroke="#A9C3DA" stroke-width="1.4"/>
<text x="570" y="466" font-size="38" font-weight="800" fill="#1B1B1F" text-anchor="start">List</text>
<text x="662" y="464" font-size="20" font-weight="400" fill="#1B1B1F" text-anchor="start">A List contains Bookings</text>
<rect id="booking-1" x="570" y="490" width="888" height="310" rx="10" fill="#E9F5EC" stroke="#9FD0AE" stroke-width="1.4"/>
<text x="594" y="534" font-size="28" font-weight="800" fill="#1B1B1F" text-anchor="start">Booking 1</text>
<text x="750" y="533" font-size="18" font-weight="400" fill="#1B1B1F" text-anchor="start">A Booking contains Procedures</text>
<rect id="procedure-1" x="594" y="560" width="340" height="96" rx="9" fill="#FFE9C2" stroke="#E9AE45" stroke-width="1.6"/>
<text x="610" y="594" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">Procedure 1</text>
<rect x="753.0" y="575" width="74" height="24" rx="12.0" fill="#CDE8FA"/>
<text x="790" y="591.5" font-size="12.5" font-weight="600" fill="#1B5C8A" text-anchor="middle">Primary</text>
<text x="610" y="624" font-size="15" font-weight="400" fill="#1B1B1F" text-anchor="start">Holds the billing context</text>
<rect id="contract-1" x="1094" y="560" width="340" height="96" rx="9" fill="#EEE9FC" stroke="#C7BAF0" stroke-width="1.6"/>
<text x="1110" y="594" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">Contract A</text>
<text x="1110" y="620" font-size="14.5" font-weight="400" fill="#1B1B1F" text-anchor="start">Defines the billing rules, pricing</text>
<text x="1110" y="639" font-size="14.5" font-weight="400" fill="#1B1B1F" text-anchor="start">and invoice recipient</text>
<path d="M940 616.0 H1078" stroke="#2E2E31" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1076 609.0 L1088 616.0 L1076 623.0 z" fill="#2E2E31"/>
<text x="1014.0" y="586.0" font-size="12.5" font-weight="400" fill="#55555E" text-anchor="middle">Each Procedure</text>
<text x="1014.0" y="601.0" font-size="12.5" font-weight="400" fill="#55555E" text-anchor="middle">selects one Contract</text>
<rect id="procedure-2" x="594" y="680" width="340" height="96" rx="9" fill="#FFE9C2" stroke="#E9AE45" stroke-width="1.6"/>
<text x="610" y="714" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">Procedure 2</text>
<text x="610" y="744" font-size="15" font-weight="400" fill="#1B1B1F" text-anchor="start">Holds the billing context</text>
<rect id="contract-2" x="1094" y="680" width="340" height="96" rx="9" fill="#EEE9FC" stroke="#C7BAF0" stroke-width="1.6"/>
<text x="1110" y="714" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">Contract B</text>
<text x="1110" y="740" font-size="14.5" font-weight="400" fill="#1B1B1F" text-anchor="start">Defines the billing rules, pricing</text>
<text x="1110" y="759" font-size="14.5" font-weight="400" fill="#1B1B1F" text-anchor="start">and invoice recipient</text>
<path d="M940 736.0 H1078" stroke="#2E2E31" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1076 729.0 L1088 736.0 L1076 743.0 z" fill="#2E2E31"/>
<text x="1014.0" y="706.0" font-size="12.5" font-weight="400" fill="#55555E" text-anchor="middle">Each Procedure</text>
<text x="1014.0" y="721.0" font-size="12.5" font-weight="400" fill="#55555E" text-anchor="middle">selects one Contract</text>
<rect id="booking-2" x="570" y="820" width="888" height="190" rx="10" fill="#E9F5EC" stroke="#9FD0AE" stroke-width="1.4"/>
<text x="594" y="864" font-size="28" font-weight="800" fill="#1B1B1F" text-anchor="start">Booking 2</text>
<text x="750" y="863" font-size="18" font-weight="400" fill="#1B1B1F" text-anchor="start">A Booking contains Procedures</text>
<rect id="procedure-3" x="594" y="890" width="340" height="96" rx="9" fill="#FFE9C2" stroke="#E9AE45" stroke-width="1.6"/>
<text x="610" y="924" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">Procedure 3</text>
<rect x="753.0" y="905" width="74" height="24" rx="12.0" fill="#CDE8FA"/>
<text x="790" y="921.5" font-size="12.5" font-weight="600" fill="#1B5C8A" text-anchor="middle">Primary</text>
<text x="610" y="954" font-size="15" font-weight="400" fill="#1B1B1F" text-anchor="start">Holds the billing context</text>
<rect id="contract-3" x="1094" y="890" width="340" height="96" rx="9" fill="#EEE9FC" stroke="#C7BAF0" stroke-width="1.6"/>
<text x="1110" y="924" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">Contract C</text>
<text x="1110" y="950" font-size="14.5" font-weight="400" fill="#1B1B1F" text-anchor="start">Defines the billing rules, pricing</text>
<text x="1110" y="969" font-size="14.5" font-weight="400" fill="#1B1B1F" text-anchor="start">and invoice recipient</text>
<path d="M940 946.0 H1078" stroke="#2E2E31" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1076 939.0 L1088 946.0 L1076 953.0 z" fill="#2E2E31"/>
<text x="1014.0" y="916.0" font-size="12.5" font-weight="400" fill="#55555E" text-anchor="middle">Each Procedure</text>
<text x="1014.0" y="931.0" font-size="12.5" font-weight="400" fill="#55555E" text-anchor="middle">selects one Contract</text>
<rect id="good-to-know" x="20" y="125.0" width="440" height="166" rx="0" fill="none"/>
<path d="M30 125.0 H20 V291.0 H30" stroke="#55555E" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="147.0" font-size="17" font-weight="700" fill="#55555E" text-anchor="start" font-style="italic">Good to know</text>
<text x="36" y="171.0" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">• Every Slot starts free. Its status shows</text>
<text x="36" y="195.0" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">   until a List is put in it.</text>
<text x="36" y="219.0" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">• The word “slot” never appears in the UI.</text>
<text x="36" y="243.0" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">• A Draft List (no anaesthetist yet) sits outside</text>
<text x="36" y="267.0" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">   the Slots until an admin assigns it.</text>
<rect id="list-pairing" x="20" y="410" width="440" height="238" rx="0" fill="none"/>
<path d="M30 410 H20 V648 H30" stroke="#55555E" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="432" font-size="17" font-weight="700" fill="#55555E" text-anchor="start" font-style="italic">A List is a specific pairing of:</text>
<text x="36" y="456" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">• 1 Anaesthetist</text>
<text x="36" y="480" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">• 1 Surgeon</text>
<text x="36" y="504" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">• 1 Hospital</text>
<text x="36" y="528" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">• 1 Day</text>
<text x="36" y="552" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">• 1 Session (AM or PM)</text>
<text x="36" y="576" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic"></text>
<text x="36" y="600" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">Each List is one unique anaesthetist + surgeon</text>
<text x="36" y="624" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">+ hospital + day + session combination.</text>
<rect id="am-pm-lists" x="20" y="782.0" width="440" height="142" rx="0" fill="none"/>
<path d="M30 782.0 H20 V924.0 H30" stroke="#55555E" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="804.0" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">AM and PM Lists on one day may be for</text>
<text x="36" y="828.0" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic">different surgeons and hospitals:</text>
<text x="36" y="852.0" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic"></text>
<text x="36" y="876.0" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic"></text>
<text x="36" y="900.0" font-size="17" font-weight="400" fill="#55555E" text-anchor="start" font-style="italic"></text>
<rect x="36" y="846.0" width="196" height="66" rx="9" fill="#E1F0FB" stroke="#A9C3DA" stroke-width="1.4"/>
<text x="50" y="875.0" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">AM List</text>
<text x="50" y="898.0" font-size="13.5" font-weight="400" fill="#55555E" text-anchor="start">→ Surgeon A · Hospital X</text>
<rect x="246" y="846.0" width="196" height="66" rx="9" fill="#E1F0FB" stroke="#A9C3DA" stroke-width="1.4"/>
<text x="260" y="875.0" font-size="21" font-weight="800" fill="#1B1B1F" text-anchor="start">PM List</text>
<text x="260" y="898.0" font-size="13.5" font-weight="400" fill="#55555E" text-anchor="start">→ Surgeon B · Hospital Y</text>
<rect x="20" y="1102" width="1518" height="40" rx="10" fill="#FFF5C4" stroke="#EFD46A" stroke-width="1.2"/>
<text x="779.0" y="1129" font-size="19" fill="#1B1B1F" text-anchor="middle"><tspan font-weight="800">Hierarchy:</tspan> Day → Slot → List → Booking → Procedure → Contract</text>
</svg>
